services:
  - type: web
    name: toxicnullified-api
    runtime: node
    rootDir: server
    buildCommand: npm install && node seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # You will set this manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false          # Set to your Vercel URL after deployment
